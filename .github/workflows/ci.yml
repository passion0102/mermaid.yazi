name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: busted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - run: busted

  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  selene:
    name: selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: cache-selene
        with:
          path: ~/.cargo/bin/selene
          key: ${{ runner.os }}-selene-v1
      - if: steps.cache-selene.outputs.cache-hit != 'true'
        run: cargo install selene
      - run: selene lib
